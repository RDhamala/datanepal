version: 2

sources:
  # Tables written by dlt. Schema names match the dlt dataset names in
  # ingestion/run.py; dlt owns these, dbt only reads them.
  - name: raw_ecn_hor
    schema: raw_ecn_hor
    description: >
      Nepal House of Representatives election results, 2082 BS (2026),
      Election Commission Nepal. gov-open. FPTP seats per party (complete,
      165 total) and PR vote counts/shares per party -- not PR seats, which
      this project does not compute; see ingestion/sources/ecn_hor.py.
    tables:
      - name: hor_2026
        description: One row per (party, result_type).

  - name: raw_hdx_admin
    schema: raw_hdx_admin
    description: >
      Nepal administrative boundaries, OCHA Common Operational Dataset via HDX.
      Licensed CC BY-IGO. The authoritative source for the geography spine:
      stable hierarchical P-codes, maintained by OCHA FISS, with geometry.
    tables:
      - name: admin_units
        description: Admin levels 1-3 (province, district, local unit) plus protected areas.

  - name: raw_hdx_boundaries
    schema: raw_hdx_boundaries
    description: >
      Administrative boundary geometry from the OCHA COD, simplified at
      ingestion. CC BY-IGO. Same source package as the tabular admin units.
    tables:
      - name: boundaries
        description: Simplified MultiPolygon geometry per admin unit, as GeoJSON strings.

  - name: raw_hdx_population
    schema: raw_hdx_population
    description: >
      Nepal subnational population statistics (COD-PS), UNFPA via HDX,
      CC BY-IGO. Already P-coded, so it joins the geography spine with no
      crosswalk. Unpivoted to long form during ingestion. Covers admin levels
      0-2 only; palika-level population requires the NSO census portal.
    tables:
      - name: population
        description: Population by place, year, sex, and 5-year age band.

  - name: raw_wikidata_names
    schema: raw_wikidata_names
    description: >
      Nepali names for local units, from Wikidata (CC0). Preferred over
      OpenStreetMap on licensing grounds: OSM is ODbL, whose share-alike terms
      would propagate to the published database.
    tables:
      - name: place_names
        description: Candidate local units with English and Nepali labels and coordinates.

  - name: raw_worldbank
    schema: raw_worldbank
    description: >
      World Bank World Development Indicators for Nepal, CC BY 4.0. National
      annual series. Structurally unlike the demographic sources: no
      subnational geography, no dimensions, mixed units including currency,
      and revised in place by the publisher.
    tables:
      - name: indicators
        description: One row per indicator-year.

  - name: raw_nso_census
    schema: raw_nso_census
    description: >
      Nepal National Population and Housing Census 2021, National Statistics
      Office. The only authoritative source below district level. Carries no
      P-codes, so it reaches the spine through a name-and-type match plus a
      committed two-row crosswalk -- see stg_nso__census_places.
    tables:
      - name: census_population
        description: >
          Households and population by sex for every admin level, plus one
          INSTITUTIONAL row per district for population not in a household.
      - name: census_literacy
        description: >
          Literacy of the population aged 5 and over, by sex, for every admin
          level. Only the all-ages aggregate is ingested.
