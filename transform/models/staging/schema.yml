version: 2

models:
  - name: stg_hdx__admin_units
    description: >
      Admin levels 1-3 from the OCHA COD, with P-code ancestry derived from the
      code's positional structure.
    columns:
      - name: pcode
        tests: [unique, not_null]
      - name: admin_level
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3]
              quote: false
      - name: unit_type
        tests:
          - accepted_values:
              values:
                - province
                - district
                - metropolitan
                - sub_metropolitan
                - municipality
                - rural_municipality
                - protected_area
