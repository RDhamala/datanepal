version: 2

models:
  - name: int_geography
    description: >
      Canonical province/district/palika spine. The join key for every dataset
      in the platform. One row per local unit; 753 nationally.
    columns:
      - name: palika_id
        description: Stable identifier for the local unit.
        tests:
          - unique
          - not_null
      - name: district_id
        tests: [not_null]
      - name: province_id
        tests:
          - not_null
          - relationships:
              to: ref('np_provinces')
              field: province_id
      - name: palika_type
        tests:
          - accepted_values:
              values:
                - metropolitan
                - sub_metropolitan
                - municipality
                - rural_municipality
              # Sources sometimes omit type; flag rather than fail the build.
              config:
                severity: warn

    # Completeness (753 palikas, 77 districts) is asserted by the singular test
    # tests/assert_geography_completeness.sql. It belongs there rather than
    # here: dbt_utils.expression_is_true evaluates per row, so a scalar
    # aggregate check written as a column/model test resolves {{ this }} to the
    # test's own audit relation and fails at runtime.
