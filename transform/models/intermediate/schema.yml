version: 2

models:
  - name: int_geography
    description: >
      Canonical geography spine: 753 local units with province and district
      lineage, keyed by OCHA P-code. Protected areas excluded. Every dataset on
      the platform joins here.
    columns:
      - name: palika_pcode
        description: OCHA P-code. The canonical join key for the platform.
        tests: [unique, not_null]
      - name: district_pcode
        tests: [not_null]
      - name: province_pcode
        tests: [not_null]
      - name: province_id
        tests:
          - not_null
          - relationships:
              to: ref('np_provinces')
              field: province_id
      - name: palika_type
        tests:
          - not_null
          - accepted_values:
              values: [metropolitan, sub_metropolitan, municipality, rural_municipality]

    # Completeness is asserted by tests/assert_geography_completeness.sql.
