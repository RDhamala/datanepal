version: 2

models:
  - name: geography
    description: >
      Published administrative geography: 753 local units keyed by P-code, with
      district and province lineage in English and Nepali.
    columns:
      - name: palika_pcode
        tests: [unique, not_null]
      - name: palika_name_en
        tests: [not_null]
      - name: palika_type
        tests: [not_null]
      - name: province_id
        tests:
          - relationships:
              to: ref('np_provinces')
              field: province_id

  - name: protected_areas
    description: >
      National parks, wildlife reserves, and conservation areas. One row per
      (area, district) intersection, so multi-district parks appear more than once.
    columns:
      - name: area_pcode
        tests: [unique, not_null]
      - name: area_name_en
        tests: [not_null]
