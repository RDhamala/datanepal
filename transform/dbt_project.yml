name: datanepal
version: "0.1.0"
config-version: 2

profile: datanepal

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  datanepal:
    # Raw source data, lightly cleaned: renamed, typed, deduplicated.
    # One staging model per source table, no joins, no business logic.
    staging:
      +materialized: view
      +schema: staging

    # Conformed dimensions and reusable joins. The geography spine lives here
    # because every dataset in the platform keys against it.
    intermediate:
      +materialized: table
      +schema: intermediate

    # Published aggregates. Everything here is safe to expose publicly and is
    # exported to static Parquet/JSON by publish/export.py.
    marts:
      +materialized: table
      +schema: marts

seeds:
  datanepal:
    +schema: seeds

    np_provinces:
      +column_types:
        province_code: VARCHAR
        province_id: INTEGER

    # Columns that are entirely empty get inferred as INTEGER, which then
    # collides with VARCHAR in joins and COALESCE. Declare anything nullable.
    place_id_overrides:
      +column_types:
        id_system: VARCHAR
        id_value: VARCHAR
        place_id: VARCHAR
        reason: VARCHAR

    dimension_members:
      +column_types:
        dimension_id: VARCHAR
        member_id: VARCHAR
        name_en: VARCHAR
        name_ne: VARCHAR
        sort_order: INTEGER
        parent_member_id: VARCHAR

    dimensions:
      +column_types:
        is_hierarchical: BOOLEAN

    licences:
      +column_types:
        share_alike: BOOLEAN
        attribution_required: BOOLEAN
        commercial_ok: BOOLEAN
        redistribution_ok: BOOLEAN
        spdx_id: VARCHAR
        url: VARCHAR

    units:
      +column_types:
        currency_code: VARCHAR
        price_basis: VARCHAR

    indicators:
      +column_types:
        is_additive: BOOLEAN
        name_ne: VARCHAR

    datasets:
      +column_types:
        artifact_url: VARCHAR
        licence_statement_url: VARCHAR
        methodology_url: VARCHAR
        retrieved: VARCHAR
        vintage: VARCHAR
        revises_published_values: BOOLEAN

vars:
  # Nepal's federal restructuring took effect in 2017; geography before and
  # after is not directly comparable. Datasets declare their vintage so models
  # can map historical boundaries onto current ones.
  federal_restructuring_year: 2017
