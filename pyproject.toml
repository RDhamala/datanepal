[project]
name = "datanepal"
version = "0.1.0"
description = "Nepal's public data, centralized: ingestion, transformation, and publication"
requires-python = ">=3.12"
dependencies = [
    # Ingestion. dlt handles incremental loads, schema evolution, and state so
    # each source connector stays a plain generator of records.
    "dlt[duckdb,filesystem]>=1.4.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "tenacity>=9.0",           # retry policy for flaky government endpoints

    # Transformation. DuckDB is the engine; dbt provides lineage, tests, docs.
    "duckdb>=1.1.0",
    "dbt-core>=1.9.0",
    "dbt-duckdb>=1.9.0",

    # Publication
    "pyarrow>=18.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23",        # validates dataset catalog entries
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "publish"]
