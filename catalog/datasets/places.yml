table: places
title: Nepal places
title_ne: नेपालका स्थानहरू
description: >
  Every addressable place in Nepal across all administrative levels: the
  country, 7 provinces, 77 districts, and 753 local units. Keyed by OCHA
  P-code, with URL slugs and parent references for hierarchical navigation.

  This is the place dimension that the observations table joins against, and
  the table that generates the site's URLs.

source:
  name: OCHA Field Information Services Section (via Humanitarian Data Exchange)
  url: https://data.humdata.org/dataset/cod-ab-npl
  accessed: "2026-08-23"

licence: CC BY-IGO

vintage: "2024"

geography_level: palika

update_frequency: irregular

contains_personal_data: false

caveats:
  - >
    Nepali names are incomplete. Provinces are hand-verified, local units are
    ~66% covered from Wikidata (CC0), and districts have none yet. NULL means
    no verified name exists; names are never transliterated.
  - >
    Slugs are derived from English names and are unique within a parent, not
    globally: 22 local unit names are shared across districts. Always qualify a
    slug by its parent.
  - >
    Excludes 22 protected areas that the source models at admin level 3; they
    are federally administered rather than local units.
