table: geography
title: Nepal administrative geography
title_ne: नेपालको प्रशासनिक भूगोल
description: >
  Canonical province, district, and local unit (palika) reference table with
  stable P-codes and names. 753 local units across 77 districts and 7
  provinces. This is the join key for every other dataset on the platform, and
  is published standalone because other projects need a canonical Nepal
  geography table and there is not a good public one.

source:
  name: OCHA Field Information Services Section (via Humanitarian Data Exchange)
  url: https://data.humdata.org/dataset/cod-ab-npl
  accessed: "2026-08-23"

licence: CC BY-IGO

vintage: "2024"

geography_level: palika

update_frequency: irregular

contains_personal_data: false

caveats:
  - >
    Nepali names are only ~66% complete. They come from Wikidata (CC0), matched
    to P-codes on district plus name; palika_name_ne is NULL where no verified
    name exists. Names are deliberately not transliterated: Nepali romanisation
    is not standardised, and a guessed name in a reference dataset is worse than
    a visible gap. Check name_match_method to see how each name was resolved.
  - >
    Keyed by OCHA P-code, which is hierarchical: a child's code is prefixed by
    its parent's, and position 7 encodes local unit type. Other Nepali sources
    use incompatible identifiers and reach this table through published
    crosswalks, not by name matching.
  - >
    Nepal's 2017 federal restructuring replaced the previous VDC and
    municipality structure entirely. Data from before 2017 does not map onto
    these units without an explicit crosswalk, which this table does not yet
    provide.
  - >
    Province names follow the post-2023 official naming. Koshi and Madhesh
    appear as "Province No. 1" and "Province No. 2" in older sources; they map
    by province_id.
  - >
    Excludes 22 protected areas that the COD models at admin level 3. They are
    federally administered rather than local units; see the protected_areas
    dataset.
