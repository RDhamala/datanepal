table: observations
title: Nepal statistical observations
title_ne: नेपालका तथ्याङ्कीय अवलोकनहरू
description: >
  The platform's canonical fact table. One row per measurement, keyed by place,
  indicator, period, and dimensions (sex, age band). Every dataset on the
  platform is published in this shape so that any indicator can be charted,
  compared, or downloaded without dataset-specific handling.

  Currently contains population from COD-PS at country, province, and district
  level. Totals coexist with their components: rows with sex='all' or
  age_band='all' are totals, so filter rather than sum to avoid double counting.

source:
  name: UNFPA (via Humanitarian Data Exchange), OCHA Common Operational Dataset
  url: https://data.humdata.org/dataset/cod-ps-npl
  accessed: "2026-08-23"

licence: CC BY-IGO

vintage: "2023"

geography_level: district

update_frequency: annual

contains_personal_data: false

caveats:
  - >
    Population figures for 2023 are projections, not census counts. Nepal's
    most recent census was 2021 (29,164,578). Do not present projected figures
    as census results.
  - >
    Rows with sex='all' or age_band='all' are totals that coexist with their
    components in the same table. Summing without filtering double counts.
  - >
    Coverage stops at district level. Local unit (palika) population is not
    available from this source and requires the National Statistics Office
    census portal.
  - >
    Province and district totals reconcile exactly to the national figure; this
    is asserted by a test on every build.
