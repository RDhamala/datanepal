dataset_id: wikidata-np-places
title: Wikidata — Nepal districts and local units
description: 'Nepali-language names for Nepal''s 77 districts and its local units,
  with coordinates, retrieved by SPARQL. Local units are found through the district
  relation; districts are found directly, with items carrying a dissolution date
  (P576) excluded so the two abolished pre-2017 districts cannot be matched to a
  living one.

  '
publisher_org_id: wikidata
acquired_from_org_id: wikidata
acquisition_method: official_api
source_tier: D
url: https://query.wikidata.org
licence_id: cc0-1.0
licence_statement_url: https://www.wikidata.org/wiki/Wikidata:Licensing
commercial_reuse: permitted
rights_review_status: reviewed_ok
retrieved: '2026-08-23'
vintage: '2026'
time_coverage: '2026'
geographic_granularity: municipality
update_frequency: irregular
revises_published_values: false
ingestion_difficulty: easy
contains_personal_data: false
caveats:
- 'Chosen over OpenStreetMap on licensing grounds, not coverage. OSM carries Nepali names
  for ~55% of units but is ODbL, whose share-alike terms would propagate to every table this
  fed.

  '
- 'Covers all 77 districts and 64% of local units. Typing is inconsistent:
  metropolitan cities are often modelled as the city rather than the administrative
  unit.

  '
- 'Romanisation disagrees with the OCHA COD for ten districts, four of them named
  differently outright rather than merely spelled differently. Those are resolved in
  district_name_fixes.csv with a written reason each, never by fuzzy matching.

  '
- Community-maintained, so names are not authoritative.
