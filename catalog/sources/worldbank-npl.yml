caveats:
- 'The World Bank restates figures as national accounts are revised. The API exposes a lastupdated
  date per indicator, which is recorded as the publication date of each observation so revisions
  are traceable.

  '
- 'National level only. These are compiled from Nepali official statistics (largely NRB and
  the National Statistics Office); the World Bank is the aggregator, not the primary collector.

  '
- 'Inflation and per-capita figures are rates and ratios. They must never be summed or averaged
  across places or periods without weighting.

