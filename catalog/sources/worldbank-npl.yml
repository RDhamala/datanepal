dataset_id: worldbank-npl
title: World Bank World Development Indicators — Nepal
description: 'National annual indicators for Nepal from the World Bank''s Indicators
  API: consumer price inflation, GDP per capita, personal remittances received; the
  health indicators life expectancy at birth, under-5 mortality, maternal mortality,
  and DPT immunization coverage; the agriculture indicators value added share of
  GDP, agricultural land share, cereal yield, and the food production index; the
  infrastructure indicators electricity access, internet use, mobile subscriptions,
  and clean cooking fuel access; the environment indicators forest area, protected
  areas, PM2.5 air pollution, and CO2 emissions per capita; the labour indicators
  unemployment rate, labour force participation rate, employment in agriculture,
  and the female-to-male labour force participation ratio; and the government finance
  indicators tax revenue, total government revenue, government consumption expenditure,
  and central government debt (debt reporting for Nepal lags to 2021).

  '
