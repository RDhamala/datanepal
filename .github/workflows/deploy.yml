name: Deploy

# Builds the whole platform from source and deploys the static site to
# Cloudflare Pages.
#
# The build is fully reproducible from the repo: it re-ingests from the
# published sources, rebuilds the warehouse, runs every test, exports the
# datasets, and only then builds the site. Nothing is deployed if a test fails,
# so a bad load cannot reach production.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN    scoped to Cloudflare Pages:Edit for this account
#   CLOUDFLARE_ACCOUNT_ID   from the Cloudflare dashboard sidebar
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv .venv --python 3.12

      - name: Install Python dependencies
        run: uv pip install -e ".[dev]"

      - name: Validate dataset catalog
        run: .venv/bin/python -m tests.check_catalog

      - name: Install dbt packages
        working-directory: transform
        run: ../.venv/bin/dbt deps

      - name: Ingest sources
        run: |
          .venv/bin/python -m ingestion.run --source hdx_admin
          .venv/bin/python -m ingestion.run --source wikidata_names
          .venv/bin/python -m ingestion.run --source hdx_population

      - name: Build and test warehouse
        working-directory: transform
        run: ../.venv/bin/dbt build --profiles-dir .

      - name: Export datasets
        run: .venv/bin/python -m publish.export

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Verify the build produced real pages
        run: |
          COUNT=$(find web/out -name index.html | wc -l | tr -d ' ')
          echo "generated $COUNT pages"
          # 1 homepage + 7 provinces + 77 districts + 404 = 86. A collapse to a
          # handful of pages means generateStaticParams saw no data, which would
          # otherwise deploy silently as an almost-empty site.
          if [ "$COUNT" -lt 80 ]; then
            echo "::error::Only $COUNT pages generated; expected at least 80"
            exit 1
          fi
          test -d web/out/data || { echo "::error::Data files not copied"; exit 1; }

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/out --project-name=datanepal --branch=main
