name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv .venv --python 3.12

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Validate catalog and project it into seeds
        run: |
          .venv/bin/python -m tests.check_catalog
          .venv/bin/python -m catalog.sync_seeds

      - name: Install dbt packages
        working-directory: transform
        run: ../.venv/bin/dbt deps

      # The geography source is a single 243KB licensed download from HDX, so
      # CI runs the real ingest rather than fixtures. Sources that require
      # heavy crawling should be fixtured instead when they are added.
      - name: Ingest geography
        run: .venv/bin/python -m ingestion.run --source hdx_admin

      - name: Ingest place names
        run: .venv/bin/python -m ingestion.run --source wikidata_names

      - name: Ingest population
        run: .venv/bin/python -m ingestion.run --source hdx_population

      - name: dbt build
        working-directory: transform
        run: ../.venv/bin/dbt build --profiles-dir .

      - name: Fold into revision history
        # Append-only. Runs before export so the published history includes this
        # build. In CI the file is not committed back, so this exercises the fold
        # rather than persisting it -- the scheduled refresh job is what commits.
        run: .venv/bin/python -m publish.revisions

      - name: Python tests
        run: .venv/bin/python -m pytest -q

      - name: Export published tables
        run: .venv/bin/python -m publish.export

      - name: Check published output
        run: |
          test -f publish/dist/manifest.json || { echo "No manifest produced"; exit 1; }
          python3 -c "
          import json, sys
          m = json.load(open('publish/dist/manifest.json'))
          if m['dataset_count'] < 1:
              sys.exit('Manifest contains no datasets')
          print(f\"Published {m['dataset_count']} dataset(s)\")
          for d in m['datasets']:
              print(f\"  {d['table']}: {d['row_count']} rows, {d['bytes']} bytes\")
          "

      - name: Upload published data
        uses: actions/upload-artifact@v4
        with:
          name: published-data
          path: publish/dist/
          retention-days: 14

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # publish/dist is committed, so the frontend checks run against the same
      # data the deployed site uses -- no need to re-run the Python pipeline.
      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npx next lint

      - name: Format check
        working-directory: web
        run: npx prettier --check "app/**/*.tsx" "components/**/*.tsx" "lib/**/*.ts"

      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Verify page count
        run: |
          COUNT=$(find web/out -name index.html | wc -l | tr -d ' ')
          echo "generated $COUNT pages"
          # 1 home + 7 provinces + 77 districts + 404. A collapse to a handful
          # means generateStaticParams saw no data, which would otherwise ship
          # silently as an almost-empty site.
          if [ "$COUNT" -lt 80 ]; then
            echo "::error::Only $COUNT pages generated; expected at least 80"
            exit 1
          fi
