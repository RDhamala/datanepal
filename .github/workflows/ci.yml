name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv .venv --python 3.12

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Validate catalog and project it into seeds
        run: |
          .venv/bin/python -m tests.check_catalog
          .venv/bin/python -m catalog.sync_seeds

      - name: Install dbt packages
        working-directory: transform
        run: ../.venv/bin/dbt deps

      # The geography source is a single 243KB licensed download from HDX, so
      # CI runs the real ingest rather than fixtures. Sources that require
      # heavy crawling should be fixtured instead when they are added.
      # One step, so a newly registered source cannot be forgotten here -- which
      # is exactly what happened when the World Bank connector was added and CI
      # kept ingesting only the first three.
      - name: Ingest all sources
        run: .venv/bin/python -m ingestion.run --all

      - name: dbt build
        working-directory: transform
        run: ../.venv/bin/dbt build --profiles-dir .

      - name: Fold into revision history
        # Append-only. Runs before export so the published history includes this
        # build. In CI the file is not committed back, so this exercises the fold
        # rather than persisting it -- the scheduled refresh job is what commits.
        run: .venv/bin/python -m publish.revisions

      - name: Python tests
        run: .venv/bin/python -m pytest -q

      - name: Export published tables
        run: .venv/bin/python -m publish.export

      - name: Check published output
        run: |
          test -f publish/dist/manifest.json || { echo "::error::No manifest"; exit 1; }
          python3 - <<'PY'
          import json, sys
          m = json.load(open("publish/dist/manifest.json"))

          if m["table_count"] < 1:
              sys.exit("Manifest contains no tables")
          if not m["sources"]:
              sys.exit("Manifest documents no sources")

          # Provenance must be complete for every source, not most of them. An
          # undocumented source is how a published figure becomes uncitable.
          for s in m["sources"]:
              for field in ("publisher", "licence", "vintage", "retrieved", "url"):
                  if not s.get(field):
                      sys.exit(f"{s['dataset_id']} is missing {field}")

          # Nothing may publish under a share-alike licence. OpenStreetMap was
          # rejected as a source on exactly these grounds; this keeps that
          # decision from being quietly undone. See docs/adr/0007.
          contaminated = [t["table"] for t in m["tables"] if t.get("share_alike")]
          if contaminated:
              sys.exit(f"share-alike licence on: {', '.join(contaminated)}")

          # Every table must resolve an effective licence.
          for t in m["tables"]:
              if not t.get("effective_licence"):
                  sys.exit(f"{t['table']} has no effective licence")

          print(f"{m['table_count']} tables, {len(m['sources'])} sources")
          for t in m["tables"]:
              print(f"  {t['table']:24} {t['row_count']:>8,} rows  {t['effective_licence']}")
          if m.get("history"):
              print(f"  history: {m['history']['row_count']:,} rows")
          PY

      - name: Upload published data
        uses: actions/upload-artifact@v4
        with:
          name: published-data
          path: publish/dist/
          retention-days: 14

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # publish/dist is committed, so the frontend checks run against the same
      # data the deployed site uses -- no need to re-run the Python pipeline.
      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npx next lint

      - name: Format check
        working-directory: web
        run: npx prettier --check "app/**/*.tsx" "components/**/*.tsx" "lib/**/*.ts"

      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Verify page count
        run: |
          COUNT=$(find web/out -name index.html | wc -l | tr -d ' ')
          LOCAL=$(find web/out/np -mindepth 4 -maxdepth 4 -name index.html | wc -l | tr -d ' ')
          echo "generated $COUNT pages, of which $LOCAL are local governments"
          # 1 home + 7 provinces + 77 districts + 753 local governments + the
          # browse and topic pages. A collapse to a handful means
          # generateStaticParams saw no data, which would otherwise ship silently
          # as an almost-empty site.
          if [ "$COUNT" -lt 800 ]; then
            echo "::error::Only $COUNT pages generated; expected at least 800"
            exit 1
          fi
          # Checked exactly, not as a floor: 753 is an externally known count,
          # and a partial geography load is the failure this platform is most
          # exposed to. 752 pages would look fine and be wrong.
          if [ "$LOCAL" -ne 753 ]; then
            echo "::error::Generated $LOCAL local government pages; expected exactly 753"
            exit 1
          fi
