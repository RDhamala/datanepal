name: Refresh data

# Re-ingests every source, rebuilds and tests the warehouse, re-exports, and
# commits publish/dist if anything changed. Cloudflare Pages watches this repo
# and rebuilds the site on that commit, so no deploy credentials are needed
# here at all.
#
# Nothing is committed unless every test passes, so a bad source load cannot
# reach the published site.
on:
  schedule:
    # 03:17 UTC on the 3rd of each month. Off-peak and off the hour: these
    # sources update irregularly, and nothing here needs to be timely.
    - cron: "17 3 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv .venv --python 3.12

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Validate catalog and project it into seeds
        run: |
          .venv/bin/python -m tests.check_catalog
          .venv/bin/python -m catalog.sync_seeds

      - name: Install dbt packages
        working-directory: transform
        run: ../.venv/bin/dbt deps

      - name: Ingest sources
        run: |
          # --all, so adding a connector does not require editing this file.
          .venv/bin/python -m ingestion.run --all

      - name: Build and test warehouse
        working-directory: transform
        run: ../.venv/bin/dbt build --profiles-dir .

      - name: Fold into revision history
        run: .venv/bin/python -m publish.revisions

      - name: Export published tables
        run: .venv/bin/python -m publish.export

      - name: Commit if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish/dist history
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          # Record what moved, so the commit explains itself in the log.
          echo "Changed files:"
          git diff --cached --name-only
          git commit -m "Refresh published data

          Automated re-ingest. All tests passed before commit.

          Co-Authored-By: Claude Opus 5 (1M context) <noreply@anthropic.com>"
          git push
