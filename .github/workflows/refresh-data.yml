name: Refresh data

# Re-ingests every source, rebuilds and tests the warehouse, re-exports, and
# commits publish/dist if anything changed. Cloudflare Pages watches this repo
# and rebuilds the site on that commit, so no deploy credentials are needed
# here at all.
#
# Nothing is committed unless every test passes, so a bad source load cannot
# reach the published site.
on:
  schedule:
    # 03:17 UTC on the 3rd of each month. Off-peak and off the hour: these
    # sources update irregularly, and nothing here needs to be timely.
    - cron: "17 3 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv .venv --python 3.12

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Validate catalog and project it into seeds
        run: |
          .venv/bin/python -m tests.check_catalog
          .venv/bin/python -m catalog.sync_seeds

      - name: Install dbt packages
        working-directory: transform
        run: ../.venv/bin/dbt deps

      - name: Ingest sources
        run: |
          # --all, so adding a connector does not require editing this file.
          .venv/bin/python -m ingestion.run --all

      - name: Build and test warehouse
        working-directory: transform
        run: ../.venv/bin/dbt build --profiles-dir .

      - name: Fold into revision history
        run: .venv/bin/python -m publish.revisions

      - name: Export published tables
        run: .venv/bin/python -m publish.export

      # Through a pull request, not a push to main.
      #
      # main requires the `build` and `web` checks to pass, and required checks
      # reject a direct push whose commit has not been checked yet -- so this
      # job pushing to main would simply be refused, and a monthly job that
      # fails is a job nobody notices for a month. A bypass is not available
      # either: this repository is user-owned, and ruleset bypass actors of
      # type Integration require an organisation.
      #
      # It is the better shape regardless. The data was already tested before
      # this point, but CI ran *after* the commit landed; now it runs before,
      # and the same gate that covers human changes covers the robot's.
      - name: Open a pull request if the data changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish/dist history
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          # Record what moved, so the commit explains itself in the log.
          echo "Changed files:"
          git diff --cached --name-only

          BRANCH="data/refresh-$(date -u +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          git commit -m "Refresh published data

          Automated re-ingest. All tests passed before the commit, and CI
          re-runs them on this branch before it can merge.

          Co-Authored-By: Claude Opus 5 (1M context) <noreply@anthropic.com>"
          git push --force-with-lease origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" \
            --title "Refresh published data" \
            --body "Automated monthly re-ingest. Every source re-fetched, the
          warehouse rebuilt and tested, and publish/dist re-exported. Merges
          itself once \`build\` and \`web\` pass.

          Changed files are in the commit; the diff is parquet, so read the
          manifest rather than the binaries."

          # Auto-merge, so the month does not depend on someone being awake.
          # If CI fails the PR stays open with the failure attached, which is
          # the outcome worth having.
          gh pr merge --auto --squash "$BRANCH"
